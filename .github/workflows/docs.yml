# Project web page on GitHub Pages: project documentation, the test GUI, the
# Libero contract and a preview of the Zephyr board page (docs/site).
#
# Pull requests only build the page (warnings are errors); main also deploys.
# Repository setting needed once: Settings -> Pages -> Source "GitHub Actions".

name: Documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - tools/hello_fpga_gui/README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - README.md
      - docs/**
      - tools/hello_fpga_gui/README.md
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Same image as the local preview (compose service "docs")
      - name: Build documentation image
        run: docker build -t docs-builder docs/site

      - name: Build the page
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace docs-builder \
            sphinx-build -W --keep-going -b html docs/site docs/site/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
