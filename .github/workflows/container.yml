# Build environment image for the dev container and GitHub Codespaces.
#
# Builds the image from the Dockerfile, builds the firmware in it (the image
# is only published if that works) and pushes it to the GitHub Container
# Registry. Image name and tag come from .devcontainer/devcontainer.json
# ("image"): to publish a changed toolchain, change the Dockerfile AND the
# tag there (and in compose.yaml) in the same commit. The firmware build runs
# on every change of the sources, the push only for a new tag.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .devcontainer/**
      - .github/workflows/container.yml
      - west.yml
      - CMakeLists.txt
      - prj.conf
      - boards/**
      - src/**
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .devcontainer/**
      - .github/workflows/container.yml
      - west.yml
      - CMakeLists.txt
      - prj.conf
      - boards/**
      - src/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Image name from .devcontainer/devcontainer.json
        id: name
        run: |
          image=$(python3 -c 'import json; print(json.load(open(".devcontainer/devcontainer.json"))["image"])')
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "repo=${image%:*}" >> "$GITHUB_OUTPUT"
          echo "Image: ${image}"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.name.outputs.image }}
            ${{ steps.name.outputs.repo }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Zephyr SDK (ARM) + west build environment for the M2S Hello FPGA Kit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the firmware in the image
        run: |
          docker run --rm \
            -v "$PWD:/workspaces/repo" -w /workspaces/repo \
            "${{ steps.name.outputs.image }}" \
            bash -c 'bash .vscode/ensure-west-workspace.sh && west build -b m2s_hello_fpga_kit/m2s010 -d build'

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/zephyr/zephyr.hex
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.bin
            build/zephyr/.config
          if-no-files-found: error

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag is published once: a changed toolchain needs a new tag in
      # .devcontainer/devcontainer.json. "Run workflow" (workflow_dispatch)
      # pushes again, e.g. to replace a broken image.
      - name: Push image (new tag or manual run)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
              && docker manifest inspect "${{ steps.name.outputs.image }}" >/dev/null 2>&1; then
            echo "${{ steps.name.outputs.image }} is already published; nothing to push."
            exit 0
          fi
          docker push "${{ steps.name.outputs.image }}"
          docker push "${{ steps.name.outputs.repo }}:sha-${{ github.sha }}"
