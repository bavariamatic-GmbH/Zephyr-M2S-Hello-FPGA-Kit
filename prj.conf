# I2C demo (LTR-329ALS on i2c0) and GUI commands on I2C_0
CONFIG_I2C=y
# The MSS I2C driver (i2c_mchp_mss.c) waits K_TICKS(1000) for the end of a
# transfer. With the default 100 ticks/s that is 10 s per transfer when the
# bus does not respond (e.g. no pull-ups); with 1000 ticks/s it is 1 s.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# SPI: raw transfers on spi0 (SS0), SPI flash U8 on spi1 (SS0)
CONFIG_SPI=y

CONFIG_PRINTK=y

# The kit's PIC32 (USB bridge of the console) must not receive anything from
# the SmartFusion2 before the PC has opened the link: no boot banner, shell
# started by src/app/host_wait.c after the first byte from the host.
CONFIG_BOOT_BANNER=n
CONFIG_SHELL_AUTOSTART=n

# Debug LEDs LD1-LD3 on MSS GPIO_0..2 (enabled by the board defconfig too)
CONFIG_GPIO=y

# Shell on the console UART (uart0 -> PIC32 -> USB) for the test GUI
# (tools/hello_fpga_gui). Commands: src/shell/.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Plain text for the GUI: no VT100 colours
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_PROMPT_UART="hk:~$ "
# Start-up and demo loop messages go through the shell (src/platform/
# console_out.c) and wait at most this long for the shell's TX mutex before
# they are dropped (default 50 ms; a 640-character line takes ~28 ms at
# 230400 bit/s)
CONFIG_SHELL_TX_TIMEOUT_MS=500
# Room for 256-byte payloads as hex (512 characters) in one command line
CONFIG_SHELL_CMD_BUFF_SIZE=640
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_STACK_SIZE=4096

# Taken over from the I2C example (apps/02_solution_i2c_driver)
CONFIG_MINIMAL_LIBC=y
CONFIG_PICOLIBC=n
